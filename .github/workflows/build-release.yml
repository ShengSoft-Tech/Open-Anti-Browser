name: Build & Release Windows Installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Build frontend
        run: |
          cd frontend
          npm install
          npm run build

      - name: Prepare browser engines
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          function Fetch-Engine($url, $zip, $exeName, $dest) {
            Write-Host "Downloading $url"
            curl.exe -L --fail -o $zip $url
            if ($LASTEXITCODE -ne 0) { throw "download failed: $url" }
            # Extract to RUNNER_TEMP so the raw archive tree is never picked up by PyInstaller's engines/ add-data.
            $extract = Join-Path $env:RUNNER_TEMP ("extract_" + [IO.Path]::GetFileNameWithoutExtension($zip))
            if (Test-Path $extract) { Remove-Item $extract -Recurse -Force }
            Expand-Archive -Path $zip -DestinationPath $extract -Force
            $exe = Get-ChildItem -Path $extract -Recurse -Filter $exeName | Select-Object -First 1
            if (-not $exe) { throw "$exeName not found inside $zip" }
            New-Item -ItemType Directory -Force -Path $dest | Out-Null
            Copy-Item -Path (Join-Path $exe.Directory.FullName '*') -Destination $dest -Recurse -Force
            if (-not (Test-Path (Join-Path $dest $exeName))) { throw "$exeName missing in $dest after copy" }
            Write-Host "Prepared $dest\$exeName"
          }

          New-Item -ItemType Directory -Force -Path engines | Out-Null
          # Chrome kernel URL comes from backend/config.py (single source of truth) — no hardcoded kernel version here.
          $chromeZipUrl = (python -c "from backend.config import CHROME_ENGINE_ZIP_URL; print(CHROME_ENGINE_ZIP_URL)").Trim()
          if (-not $chromeZipUrl) { throw "CHROME_ENGINE_ZIP_URL is empty from backend.config" }
          Write-Host "Chrome kernel zip (from config.py): $chromeZipUrl"
          Fetch-Engine $chromeZipUrl "chrome.zip" "chrome.exe" "engines/chrome"
          Fetch-Engine `
            "https://github.com/LoseNine/ruyipage/releases/download/151-ruyi/firefox-151.0a1.en-US.win64.zip" `
            "firefox.zip" "firefox.exe" "engines/firefox"

          Write-Host "=== engines layout ==="
          Get-ChildItem engines/chrome/chrome.exe, engines/firefox/firefox.exe | Format-Table FullName, Length

      - name: Build app with PyInstaller (onedir, engines bundled)
        run: >
          pyinstaller
          --noconfirm
          --onedir
          --windowed
          --name "Open-Anti-Browser"
          --icon "assets/app.ico"
          --add-data "frontend/dist;frontend/dist"
          --add-data "assets;assets"
          --add-data "engines;engines"
          --hidden-import "websockets"
          --hidden-import "websockets.legacy"
          --hidden-import "websockets.legacy.client"
          --hidden-import "ruyipage"
          --collect-submodules "curl_cffi"
          launch_app.py

      - name: Build installer with Inno Setup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          choco install innosetup --no-progress -y
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found at $iscc" }
          $v = "${{ github.ref_name }}" -replace '^v', ''
          if (-not ($v -match '^\d+(\.\d+)+')) { $v = '0.0.0' }
          Write-Host "Building installer version $v"
          & $iscc "/DMyAppVersion=$v" "/DRepoRoot=$($PWD.Path)" ".github\installer.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }
          Get-ChildItem installer_out

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Open-Anti-Browser-Setup
          path: installer_out/Open-Anti-Browser-Setup.exe
          if-no-files-found: error

  build-macos:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Build frontend
        run: |
          cd frontend
          npm install
          npm run build

      - name: Install create-dmg
        shell: bash
        run: |
          set -euo pipefail
          brew install create-dmg

      - name: Resolve version
        shell: bash
        run: |
          set -euo pipefail
          # D-08:版本一致性判定落在 scripts/release/check_version_consistency.py
          # 的纯函数里(有 tests/test_version_consistency.py 单测覆盖),而不是内联在
          # 这里。tag 触发时三方(tag/package.json/main.py)必须全等；workflow_dispatch
          # 手动触发时 ref 是分支名，只比对 package.json 与 main.py 两者，不参照分支
          # 名，保证 D-04 的调试通道不被这道校验堵死。
          IS_TAG="false"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            IS_TAG="true"
          fi

          set +e
          APP_VERSION="$(python3 scripts/release/check_version_consistency.py "$GITHUB_REF_NAME" "$IS_TAG")"
          CHECK_EXIT=$?
          set -e
          if [[ "$CHECK_EXIT" -ne 0 ]]; then
            echo "错误: 版本一致性校验失败(check_version_consistency.py 退出码 $CHECK_EXIT)" >&2
            exit "$CHECK_EXIT"
          fi
          if [[ -z "$APP_VERSION" ]]; then
            echo "错误: APP_VERSION 解析为空" >&2
            exit 1
          fi
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "Resolved APP_VERSION=$APP_VERSION"

      - name: Prepare browser engine (macOS arm64)
        shell: bash
        run: |
          set -euo pipefail
          # 内核 URL 单一事实源来自 backend/config.py，同构 windows job :62 的既有约定，
          # 内核版本不在 yml 里硬编码。
          CHROME_ZIP_URL="$(python3 -c "from backend.config import CHROME_ENGINE_ZIP_URL_MACOS_ARM64; print(CHROME_ENGINE_ZIP_URL_MACOS_ARM64)")"
          if [[ -z "$CHROME_ZIP_URL" ]]; then
            echo "错误: CHROME_ENGINE_ZIP_URL_MACOS_ARM64 从 backend.config 解析为空" >&2
            exit 1
          fi
          echo "Chrome kernel zip (from config.py): $CHROME_ZIP_URL"

          # 原始的、未经任何拷贝的内核保留在 RUNNER_TEMP，供后面的 "Inject Chrome kernel"
          # 步骤直接 ditto 注入 .app（刻意不在仓库树内解压，避免 PyInstaller 的
          # --add-data engines 把 400MB 原始档树也打进去）。
          KERNEL_DIR="$RUNNER_TEMP/kernel"
          rm -rf "$KERNEL_DIR"
          mkdir -p "$KERNEL_DIR"

          EXTRACT_DIR="$RUNNER_TEMP/extract_chrome"
          rm -rf "$EXTRACT_DIR"
          mkdir -p "$EXTRACT_DIR"

          curl -L --fail -o "$RUNNER_TEMP/chrome.zip" "$CHROME_ZIP_URL" \
            || { echo "错误: 内核下载失败: $CHROME_ZIP_URL" >&2; exit 1; }
          # ditto 而非 unzip：保留符号链接与内核既有的 ad-hoc/linker-signed 签名封套。
          ditto -x -k "$RUNNER_TEMP/chrome.zip" "$EXTRACT_DIR" \
            || { echo "错误: ditto 解压失败: $RUNNER_TEMP/chrome.zip" >&2; exit 1; }

          APP_SRC="$(find "$EXTRACT_DIR" -maxdepth 2 -name "Chromium.app" -print -quit)"
          if [[ -z "$APP_SRC" ]]; then
            echo "错误: 解压后未找到 Chromium.app: $EXTRACT_DIR" >&2
            exit 1
          fi
          ditto "$APP_SRC" "$KERNEL_DIR/Chromium.app" \
            || { echo "错误: ditto 拷贝内核到 $KERNEL_DIR 失败" >&2; exit 1; }

          # 仓库树内只建占位目录，让 pyinstaller 的 --add-data "engines:engines" 建出
          # 目录结构与符号链接，不让 pyinstaller 去搬 400MB 的内核（它不保证保留符号链接与签名）。
          rm -rf engines
          mkdir -p engines/chrome
          echo "kernel injected post-build by 'Inject Chrome kernel into .app' step" > engines/chrome/.placeholder

          echo "内核已就绪: $KERNEL_DIR/Chromium.app"
          ls -la "$KERNEL_DIR/Chromium.app/Contents/MacOS/"

      - name: Build app with PyInstaller (onedir, .app bundle)
        shell: bash
        run: >
          pyinstaller
          --noconfirm
          --onedir
          --windowed
          --name "Open-Anti-Browser"
          --icon "assets/app.icns"
          --osx-bundle-identifier "com.shengsoft.openantibrowser"
          --add-data "frontend/dist:frontend/dist"
          --add-data "assets:assets"
          --add-data "engines:engines"
          --hidden-import "websockets"
          --hidden-import "websockets.legacy"
          --hidden-import "websockets.legacy.client"
          --collect-submodules "curl_cffi"
          launch_app.py

      - name: Patch Info.plist
        shell: bash
        run: |
          set -euo pipefail
          PLIST="dist/Open-Anti-Browser.app/Contents/Info.plist"
          if [[ ! -f "$PLIST" ]]; then
            echo "错误: Info.plist 不存在: $PLIST" >&2
            exit 1
          fi
          # plutil -replace 是幂等 upsert：键不存在则插入，存在则覆盖（RESEARCH Pattern 3）。
          # 必须严格排在后面所有 codesign 调用之前（Pitfall 1：签名后改 plist 会让签名失效）。
          plutil -replace CFBundleShortVersionString -string "$APP_VERSION" "$PLIST"
          plutil -replace CFBundleVersion -string "$APP_VERSION" "$PLIST"
          # RESEARCH 假设 A3 的历史演进:12.0(Monterey)占位值先被 05-03 的 4-binary
          # 抽样(仅 QtCore/QtWidgets/QtWebEngineCore/QtWebEngineProcess)实测推翻为
          # 13.0；05-04 首次真机跑通后面新增的架构/dist/最低系统版本硬断言步骤，对
          # Contents/Frameworks 下**全部** Mach-O 二进制做完整枚举(而非抽样)后，
          # 发现 15.0(Sequoia)才是真正的上确界(具体二进制见该步骤 CI 日志的完整
          # minos 抽样输出)。此处采用完整枚举的实测值定稿。
          plutil -replace LSMinimumSystemVersion -string "15.0" "$PLIST"

          echo "=== Info.plist (patched) ==="
          plutil -p "$PLIST"

      - name: Inject Chrome kernel into .app
        shell: bash
        run: |
          set -euo pipefail
          APP="dist/Open-Anti-Browser.app"
          ENGINES_LINK="$APP/Contents/Frameworks/engines"

          # config.ENGINES_DIR 在冻结态下解析正确的前提：Contents/Frameworks/engines 必须
          # 是指向 ../Resources/engines 的符号链接（RESEARCH Pattern 1 实测结论）。
          if [[ -L "$ENGINES_LINK" ]]; then
            echo "断言通过: $ENGINES_LINK 是符号链接 -> $(readlink "$ENGINES_LINK")"
          else
            echo "::warning::偏离告示 - $ENGINES_LINK 不是符号链接（不满足 RESEARCH Pattern 1 预期），显式补建"
            mkdir -p "$APP/Contents/Frameworks"
            rm -rf "$ENGINES_LINK"
            ln -s "../Resources/engines" "$ENGINES_LINK"
            echo "已补建符号链接: $ENGINES_LINK -> ../Resources/engines"
          fi

          DEST="$APP/Contents/Resources/engines/chrome/Chromium.app"
          rm -rf "$DEST"
          mkdir -p "$(dirname "$DEST")"
          # ditto 而非 cp -R：唯一能保留符号链接与既有签名封套的拷贝方式。
          ditto "$RUNNER_TEMP/kernel/Chromium.app" "$DEST" \
            || { echo "错误: ditto 注入内核失败" >&2; exit 1; }

          echo "=== 内核目录结构（注入后） ==="
          ls -la "$APP/Contents/Resources/engines/chrome/"

      - name: Enumerate nested bundles and minimum OS versions (A2/A3 diagnostics)
        shell: bash
        run: |
          set -euo pipefail
          APP="dist/Open-Anti-Browser.app"

          echo "=== 嵌套 bundle 枚举（find 默认不跟随符号链接，不会经 Contents/Frameworks/engines 重复走进内核子树） ==="
          find "$APP" \( -name "*.app" -o -name "*.framework" \) -print | sort

          echo "=== Qt 相关二进制 LC_BUILD_VERSION / minos 抽样 ==="
          # PySide6 6.9+ 把全部 Qt*.framework 与 QtWebEngineProcess.app 收纳在
          # Contents/Frameworks/PySide6/Qt/lib/ 下，并非直接在 Contents/Frameworks/
          # 顶层（首次真实运行已实测确认，见 05-03-SUMMARY.md A2 记录）；用 find 递归
          # 定位，抽样 QtCore/QtWidgets/QtWebEngineCore 三个代表性 framework 加上
          # QtWebEngineProcess.app 本身。
          QT_SAMPLE=(
            "$(find "$APP/Contents/Frameworks" -name "QtCore.framework" -print -quit)"
            "$(find "$APP/Contents/Frameworks" -name "QtWidgets.framework" -print -quit)"
            "$(find "$APP/Contents/Frameworks" -name "QtWebEngineCore.framework" -print -quit)"
            "$(find "$APP/Contents/Frameworks" -name "QtWebEngineProcess.app" -print -quit)"
          )
          for f in "${QT_SAMPLE[@]}"; do
            [[ -n "$f" && -e "$f" ]] || continue
            BIN=""
            if [[ -d "$f" && "$f" == *.framework ]]; then
              NAME="$(basename "$f" .framework)"
              BIN="$f/Versions/Current/$NAME"
            elif [[ -d "$f" && "$f" == *.app ]]; then
              BIN="$f/Contents/MacOS/$(basename "$f" .app)"
            fi
            if [[ -n "$BIN" && -f "$BIN" ]]; then
              echo "--- $BIN ---"
              otool -l "$BIN" | grep -A3 LC_BUILD_VERSION || echo "(无 LC_BUILD_VERSION 段)"
            fi
          done

      - name: Sign nested bundles and app (layered ad-hoc)
        shell: bash
        run: |
          set -euo pipefail
          APP="dist/Open-Anti-Browser.app"
          KERNEL_APP="$APP/Contents/Resources/engines/chrome/Chromium.app"
          FRAMEWORK="$KERNEL_APP/Contents/Frameworks/Chromium Framework.framework"

          # 由内向外逐层 ad-hoc 签名（D-13/Pattern 2）：外层与内层的签名调用都不携带
          # 递归签名开关（--deep 对嵌套 bundle 是空操作，见 Pitfall 2）。

          echo "=== 1) 签 Chromium 内核的 Helper.app ==="
          for helper in "$FRAMEWORK/Versions/Current/Helpers"/*.app; do
            [[ -e "$helper" ]] || continue
            echo "codesign: $helper"
            codesign --force --sign - "$helper" \
              || { echo "错误: codesign 失败: $helper" >&2; exit 1; }
          done

          echo "=== 2) 签 Chromium Framework/Versions/Current ==="
          codesign --force --sign - "$FRAMEWORK/Versions/Current" \
            || { echo "错误: codesign 失败: $FRAMEWORK/Versions/Current" >&2; exit 1; }

          echo "=== 3) 签内嵌 Chromium.app 自身 ==="
          codesign --force --sign - "$KERNEL_APP" \
            || { echo "错误: codesign 失败: $KERNEL_APP" >&2; exit 1; }

          echo "=== 4) 枚举 Qt/PySide6 侧嵌套 bundle（排除内核子树），按路径深度倒序逐个签名 ==="
          NESTED_LIST="$(find "$APP/Contents/Frameworks" \( -name "*.app" -o -name "*.framework" \) -not -path "*/engines/*" -print | awk -F/ '{print NF, $0}' | sort -rn | cut -d' ' -f2-)"
          while IFS= read -r item; do
            [[ -z "$item" ]] && continue
            [[ -e "$item" ]] || continue
            if [[ -d "$item" && "$item" == *.framework && -e "$item/Versions/Current" ]]; then
              echo "codesign (framework): $item/Versions/Current"
              codesign --force --sign - "$item/Versions/Current" \
                || { echo "错误: codesign 失败: $item/Versions/Current" >&2; exit 1; }
            else
              echo "codesign: $item"
              codesign --force --sign - "$item" \
                || { echo "错误: codesign 失败: $item" >&2; exit 1; }
            fi
          done <<< "$NESTED_LIST"

          echo "=== 5) 签外层 Open-Anti-Browser.app ==="
          codesign --force --sign - "$APP" \
            || { echo "错误: codesign 失败: $APP" >&2; exit 1; }

      - name: Verify code signatures (outer + nested kernel)
        shell: bash
        run: |
          set -euo pipefail
          APP="dist/Open-Anti-Browser.app"
          KERNEL_APP="$APP/Contents/Resources/engines/chrome/Chromium.app"

          # PKG-03 硬门禁：外层与内嵌 Chromium.app 分别验证，缺一不可（Pitfall 2 —
          # 只验外层会给出假阳性通过；Pitfall 3 — 内核资产重签前本来就过不了这条验证，
          # 所以本步骤必须排在签名步骤之后）。
          echo "=== 验证外层 .app ==="
          codesign --verify --deep --strict "$APP" \
            || { echo "错误: 外层 .app 签名验证失败" >&2; exit 1; }

          echo "=== 验证内嵌 Chromium.app（单独） ==="
          codesign --verify --deep --strict "$KERNEL_APP" \
            || { echo "错误: 内嵌 Chromium.app 签名验证失败" >&2; exit 1; }

          echo "签名门禁通过：外层与内层均验证成功"

      - name: Assert bundle contents (arch / frontend-dist / min-os)
        shell: bash
        run: |
          set -euo pipefail
          APP="dist/Open-Anti-Browser.app"

          echo "=== 架构断言(arm64) ==="
          assert_arm64() {
            local bin="$1"
            local label="$2"
            if [[ ! -f "$bin" ]]; then
              echo "错误: $label 不存在: $bin" >&2
              exit 1
            fi
            local archs
            archs="$(lipo -archs "$bin")"
            echo "$label lipo -archs: $archs"
            if [[ "$archs" != *arm64* ]]; then
              echo "错误: $label 不含 arm64 架构(实际: $archs)" >&2
              exit 1
            fi
            local file_out
            file_out="$(file "$bin")"
            echo "$label file: $file_out"
            if [[ "$file_out" != *arm64* ]]; then
              echo "错误: $label 的 file 输出未确认 arm64(实际: $file_out)" >&2
              exit 1
            fi
          }
          assert_arm64 "$APP/Contents/MacOS/Open-Anti-Browser" "主二进制"
          assert_arm64 "$APP/Contents/Resources/engines/chrome/Chromium.app/Contents/MacOS/Chromium" "内核二进制"
          echo "断言通过: 主二进制与内核二进制均为 arm64"

          echo "=== frontend/dist 进包断言(PKG-05,backend/_g.py 在 dist 缺失时会静默跳过,靠这道结构断言独立抓) ==="
          DIST_DIR="$APP/Contents/Resources/frontend/dist"
          if [[ ! -d "$DIST_DIR" ]]; then
            echo "错误: $DIST_DIR 不是目录(frontend/dist 未进包)" >&2
            exit 1
          fi
          if [[ ! -f "$APP/Contents/Resources/frontend/dist/index.html" ]]; then
            echo "错误: $APP/Contents/Resources/frontend/dist/index.html 不存在" >&2
            exit 1
          fi
          DIST_FILE_COUNT="$(find "$DIST_DIR" -type f | wc -l | tr -d ' ')"
          if [[ "$DIST_FILE_COUNT" -eq 0 ]]; then
            echo "错误: $DIST_DIR 内递归文件数为 0" >&2
            exit 1
          fi
          echo "断言通过: $DIST_DIR 存在, index.html 存在, 递归文件数=$DIST_FILE_COUNT"

          FRONTEND_LINK="$APP/Contents/Frameworks/frontend"
          if [[ ! -L "$FRONTEND_LINK" ]]; then
            echo "错误: $FRONTEND_LINK 不是符号链接" >&2
            exit 1
          fi
          FRONTEND_LINK_TARGET="$(readlink "$FRONTEND_LINK")"
          if [[ "$FRONTEND_LINK_TARGET" != "../Resources/frontend" ]]; then
            echo "错误: $FRONTEND_LINK 符号链接目标不是 ../Resources/frontend(实际: $FRONTEND_LINK_TARGET)" >&2
            exit 1
          fi
          echo "断言通过: $FRONTEND_LINK -> $FRONTEND_LINK_TARGET"

          echo "=== 最低系统版本断言(核销 RESEARCH 假设 A3) ==="
          PLIST_MINOS="$(plutil -extract LSMinimumSystemVersion raw "$APP/Contents/Info.plist")"
          echo "Info.plist LSMinimumSystemVersion: $PLIST_MINOS"

          MINOS_LIST="$RUNNER_TEMP/minos-list.txt"
          : > "$MINOS_LIST"
          # find 默认不跟随符号链接(05-03 已确认的口径),排除内核子树；对每个常规
          # 文件用 file 判定是否 Mach-O，是的话用 otool -l 抽 LC_BUILD_VERSION 的
          # minos。每行记录 "<minos>\t<path>"，便于定位是哪个具体二进制把上确界
          # 拉高的(sort -V 只按第一列 tab 前的版本号排序)。
          while IFS= read -r -d '' bin; do
            if file "$bin" 2>/dev/null | grep -q "Mach-O"; then
              m="$(otool -l "$bin" 2>/dev/null | awk '/LC_BUILD_VERSION/{f=1;next} f&&/minos/{print $2; exit}')"
              [[ -n "$m" ]] && printf '%s\t%s\n' "$m" "$bin" >> "$MINOS_LIST"
            fi
          done < <(find "$APP/Contents/Frameworks" -type f -not -path "*/engines/*" -print0)

          if [[ ! -s "$MINOS_LIST" ]]; then
            echo "错误: 未在 Contents/Frameworks 下找到任何带 LC_BUILD_VERSION 的 Mach-O 文件" >&2
            exit 1
          fi

          echo "=== 全部 Mach-O minos 抽样(按版本号排序,便于核对上确界来源) ==="
          sort -t "$(printf '\t')" -k1,1V "$MINOS_LIST"

          MINOS_SUP_LINE="$(sort -t "$(printf '\t')" -k1,1V "$MINOS_LIST" | tail -1)"
          MINOS_SUP="$(printf '%s' "$MINOS_SUP_LINE" | cut -f1)"
          MINOS_SUP_PATH="$(printf '%s' "$MINOS_SUP_LINE" | cut -f2)"
          echo "Mach-O LC_BUILD_VERSION minos 上确界: $MINOS_SUP (来自: $MINOS_SUP_PATH)"

          COMPARE_TOP="$(printf '%s\n%s\n' "$MINOS_SUP" "$PLIST_MINOS" | sort -V | tail -1)"
          if [[ "$COMPARE_TOP" != "$PLIST_MINOS" ]]; then
            echo "错误: Info.plist LSMinimumSystemVersion($PLIST_MINOS) 低于 Mach-O 实测上确界($MINOS_SUP,来自 $MINOS_SUP_PATH),请把 'Patch Info.plist' 步骤里的取值调到至少 $MINOS_SUP" >&2
            exit 1
          fi
          echo "断言通过: LSMinimumSystemVersion($PLIST_MINOS) >= Mach-O 实测上确界($MINOS_SUP)"

      - name: Smoke test (--backend-only)
        shell: bash
        run: |
          set -euo pipefail
          APP_BIN="dist/Open-Anti-Browser.app/Contents/MacOS/Open-Anti-Browser"
          SMOKE_PORT=18123
          SMOKE_LOG="$RUNNER_TEMP/smoke-test.log"

          # --backend-only 而非完整 GUI：绕开 QtWebEngine/GPU 在无人值守 runner 上的
          # 不确定性，但仍覆盖 D-14 想抓的失败模式——launch_app.main 开头先跑
          # backend/_g.py 的运行时完整性校验(_0x2f("runtime"))，再分派到
          # run_backend_only，模块加载失败/依赖缺失/校验拒启都会在这条路径上原形毕露。
          "$APP_BIN" --backend-only --port "$SMOKE_PORT" > "$SMOKE_LOG" 2>&1 &
          SMOKE_PID=$!

          PASSED=0
          for i in $(seq 1 30); do
            if curl -sf "http://127.0.0.1:${SMOKE_PORT}/api/bootstrap" >/dev/null 2>&1; then
              echo "冒烟通过: /api/bootstrap 响应正常(第 ${i} 次轮询)"
              PASSED=1
              break
            fi
            sleep 1
          done

          if [[ "$PASSED" -eq 1 ]]; then
            kill "$SMOKE_PID" 2>/dev/null || true
            wait "$SMOKE_PID" 2>/dev/null || true
            exit 0
          fi

          echo "错误: 30s 内未获得 /api/bootstrap 响应" >&2
          echo "=== 子进程 stdout/stderr ===" >&2
          cat "$SMOKE_LOG" >&2 || true
          kill "$SMOKE_PID" 2>/dev/null || true
          exit 1

      - name: GUI launch smoke test (real Cocoa event loop — crash + Cmd+Q exit regression gate)
        shell: bash
        run: |
          # 显式 set +e：GitHub Actions 的 shell: bash 默认用 `bash -e -o pipefail`
          # 调用整段 run 脚本（这条继承的 -e 不会被脚本内的 `set -uo pipefail` 关掉，
          # 必须显式 +e 才能覆盖）。本步骤要手动汇总多个失败信号（进程是否提前退出 /
          # 是否有新增崩溃报告 / Quit 请求后是否真的退出）后再统一报告，任何一条子
          # 命令非零都不能让脚本提前中止——首轮验证跑就实测到这个坑：wait 捕获到
          # segfault 的 139 退出码后，若 -e 仍然生效，脚本会在打印自定义诊断信息之
          # 前就被直接中止退出。
          set +e -uo pipefail
          #
          # 本步骤覆盖两类不同的 05-06 real-machine checkpoint 缺陷，缺一不可：
          #
          # 维度一（05-02 gap-fix #1，已由本步骤覆盖）：launch_app.py 在 QApplication
          # 实例上 installEventFilter(...) 导致的 SIGSEGV，栈顶在 -[NSWindow
          # makeKeyAndOrderFront:] 触发的 QtQuick focus 分发路径上。判定信号：进程在
          # DWELL_SECONDS 存活窗口内是否提前消失 / 是否有新增崩溃报告。
          #
          # 维度二（05-02 gap-fix #2，本次新增）：DesktopApplication.event() 把
          # handle_macos_quit_request(...) 的返回值当 `return True` 的早退门禁，
          # super().event(e) 永远跑不到，QCoreApplication::event() 对 QEvent.Quit
          # 的默认处理（真正让事件循环退出的那一步）被跳过。表现为进程"存活得太
          # 好"——上面维度一的存活判定在这个缺陷下反而会 PASS（进程确实没有在
          # DWELL 窗口内异常退出，因为它压根不会退出）。必须在存活确认之后再补一步
          # ：真的发一个会产生 QEvent::Quit 的 Quit 请求，然后断言进程在有界超时内
          # 消失。用 `kill -TERM` 无法覆盖这个维度——POSIX 信号不会被 Qt 翻译成
          # QEvent::Quit，测不出这个缺陷类；必须是应用层的 Quit 请求，与用户按
          # Cmd+Q 走同一条 Apple Event 路径。
          #
          # 两个维度都必须走真实的 cocoa 平台插件——QT_QPA_PLATFORM=offscreen 会绕
          # 开 -[NSWindow makeKeyAndOrderFront:] 与 Cocoa 的 applicationShouldTerminate:
          # 终止协议，两个缺陷都测不出，所以本步骤刻意不设置该变量。
          APP="dist/Open-Anti-Browser.app"
          APP_BIN="$APP/Contents/MacOS/Open-Anti-Browser"
          APP_DISPLAY_NAME="Open-Anti-Browser"
          DWELL_SECONDS=18
          QUIT_TIMEOUT_SECONDS=12
          GUI_LOG="$RUNNER_TEMP/gui-smoke.log"
          CRASH_DIR="$HOME/Library/Logs/DiagnosticReports"

          echo "=== 记录测试开始前已存在的崩溃报告(避免历史 report 被误判为本次新增) ==="
          mkdir -p "$CRASH_DIR"
          BEFORE_CRASHES="$RUNNER_TEMP/crashes-before.txt"
          ls "$CRASH_DIR" 2>/dev/null | grep -i "Open-Anti-Browser" > "$BEFORE_CRASHES" || true
          echo "已有 $(wc -l < "$BEFORE_CRASHES" | tr -d ' ') 份历史崩溃报告"

          echo "=== 启动真实 GUI 进程(非 --backend-only，完整走到 window.show()/activateWindow()) ==="
          "$APP_BIN" > "$GUI_LOG" 2>&1 &
          APP_PID=$!
          echo "已启动 PID=$APP_PID (持续观察 ${DWELL_SECONDS}s)"

          SURVIVED=1
          CRASH_SECOND=""
          for i in $(seq 1 "$DWELL_SECONDS"); do
            if ! kill -0 "$APP_PID" 2>/dev/null; then
              echo "错误: 进程在第 ${i}s 时已退出(期望存活满 ${DWELL_SECONDS}s)" >&2
              SURVIVED=0
              CRASH_SECOND="$i"
              break
            fi
            sleep 1
          done

          FAIL=0
          QUIT_EXITED=""

          if [[ "$SURVIVED" -eq 1 ]]; then
            echo "存活满 ${DWELL_SECONDS}s，未观察到进程提前退出(未崩溃)"
            echo "=== 维度二：发送真实 Quit 请求(与 Cmd+Q 同一条 Apple Event 路径) ==="
            # tell application "..." to quit 发送标准 kAEQuitApplication Apple
            # Event，Cocoa 默认处理会转发给 -[NSApplication terminate:]，与用户按
            # Cmd+Q 或从菜单选 Quit 完全同一条路径——本机已实测确认(对本机已安装的
            # 缺陷版 .app 用同一条命令)：即使 osascript 自身因等待回复超时而报错退
            # 出(User canceled/-128 一类)，事件依然已经送达并触发了应用的 Quit 处
            # 理(CPU 从 ~1% 跳到 ~60%、端口 8000 被释放，与真机 Cmd+Q 症状完全一致)
            # ——因此下面刻意不以 osascript 自身的退出码作为判定依据，只把它当诊断
            # 日志，真正的判定信号是"进程是否在有界超时内消失"。
            osascript -e "tell application \"${APP_DISPLAY_NAME}\" to quit" \
              > "$RUNNER_TEMP/osascript-quit.log" 2>&1
            OSASCRIPT_EXIT=$?
            echo "osascript 退出码(仅供诊断,不作为判定依据): $OSASCRIPT_EXIT"
            cat "$RUNNER_TEMP/osascript-quit.log" 2>&1 || true

            QUIT_EXITED=0
            QUIT_ELAPSED=""
            for i in $(seq 1 "$QUIT_TIMEOUT_SECONDS"); do
              if ! kill -0 "$APP_PID" 2>/dev/null; then
                QUIT_EXITED=1
                QUIT_ELAPSED="$i"
                break
              fi
              sleep 1
            done

            if [[ "$QUIT_EXITED" -eq 1 ]]; then
              echo "进程在收到 Quit 请求后第 ${QUIT_ELAPSED}s 内退出"
            else
              echo "错误: 进程在收到 Quit 请求后 ${QUIT_TIMEOUT_SECONDS}s 内仍未退出" \
                   "—— 这正是 05-06 二次 real-machine checkpoint 抓到的 Cmd+Q 无限循环" \
                   "缺陷(DesktopApplication.event() 吞掉 QEvent.Quit 后从未转交给" \
                   "super().event(e)，事件循环永远不退出，进程停在约 60% CPU 不退出" \
                   "而不是崩溃)" >&2
              echo "=== 存活确认(kill -0)与 CPU/内存占用抽样，作为诊断证据 ===" >&2
              ps -p "$APP_PID" -o pid,pcpu,pmem,etime,command 2>&1 >&2 || true
              FAIL=1
              echo "=== 强制清理挂起进程，防止残留影响 runner 后续步骤 ===" >&2
              kill -9 "$APP_PID" 2>/dev/null || true
            fi
          fi

          wait "$APP_PID" 2>/dev/null
          EXIT_CODE=$?
          echo "进程最终退出码: $EXIT_CODE"

          echo "=== 子进程 stdout/stderr ==="
          cat "$GUI_LOG" 2>&1 || true

          # macOS 的 ReportCrash 守护进程把 .ips 写盘不是和进程死亡同步发生的——首轮
          # 验证跑(run 30408617294)实测到 segfault 后立即比对崩溃报告目录会是空的
          # (ReportCrash 还没写完)。这是本步骤 FAIL 判定的次要信号，主判定是下面的
          # SURVIVED 标志 + QUIT_EXITED 标志，已经在多次真实 CI 跑里验证足够可靠；
          # 这个 sleep 只是让 NEW_CRASHES 这个辅助信号也尽量抓到完整证据。
          sleep 3
          echo "=== 比对崩溃报告目录，找出本次运行新增的报告 ==="
          AFTER_CRASHES="$RUNNER_TEMP/crashes-after.txt"
          ls "$CRASH_DIR" 2>/dev/null | grep -i "Open-Anti-Browser" > "$AFTER_CRASHES" || true
          NEW_CRASHES="$(comm -13 <(sort "$BEFORE_CRASHES") <(sort "$AFTER_CRASHES"))"

          if [[ "$SURVIVED" -ne 1 ]]; then
            echo "错误: GUI 进程未能存活满 ${DWELL_SECONDS}s(第 ${CRASH_SECOND}s 时已消失)" >&2
            FAIL=1
          fi
          if [[ -n "$NEW_CRASHES" ]]; then
            echo "错误: 检测到本次运行新增的崩溃报告:" >&2
            echo "$NEW_CRASHES" >&2
            while IFS= read -r report; do
              [[ -z "$report" ]] && continue
              echo "--- $CRASH_DIR/$report (前 120 行，含崩溃线程栈) ---" >&2
              head -120 "$CRASH_DIR/$report" >&2 || true
            done <<< "$NEW_CRASHES"
            FAIL=1
          fi

          echo "=== 残留进程断言(Quit 之后不应再有 Open-Anti-Browser 相关进程) ==="
          RESIDUAL="$(pgrep -f "$APP_BIN" 2>/dev/null || true)"
          if [[ -n "$RESIDUAL" ]]; then
            echo "错误: 检测到残留进程:" >&2
            while IFS= read -r pid; do
              [[ -z "$pid" ]] && continue
              ps -p "$pid" -o pid,ppid,pcpu,etime,command 2>&1 >&2 || true
            done <<< "$RESIDUAL"
            FAIL=1
          else
            echo "断言通过: 未检测到残留进程"
          fi

          if [[ "$FAIL" -ne 0 ]]; then
            echo "错误: GUI 冒烟测试失败 —— 覆盖 05-06 real-machine checkpoint 抓到的两类" \
                 "缺陷: (1)「双击后 ~2s 内 SIGSEGV」崩溃路径 (2)「Cmd+Q 后无限循环不" \
                 "退出」路径。若任一缺陷的修复被回退或类似反模式被重新引入，本步骤" \
                 "会在这里拦下。" >&2
            exit 1
          fi
          echo "GUI 冒烟测试通过: 进程在真实 cocoa 事件循环下存活 ${DWELL_SECONDS}s" \
               "且期间无新增崩溃报告，随后收到 Quit 请求(与 Cmd+Q 同路径)后" \
               "${QUIT_ELAPSED}s 内干净退出，无残留进程"

      - name: Create dmg
        shell: bash
        run: |
          set -euo pipefail
          APP="dist/Open-Anti-Browser.app"
          DMG_NAME="Open-Anti-Browser-${APP_VERSION}-arm64.dmg"

          # 幂等清理：重跑时目标 dmg 与可能残留的同名挂载卷都先清掉。
          rm -f "$DMG_NAME"
          hdiutil detach "/Volumes/Open-Anti-Browser $APP_VERSION" 2>/dev/null || true

          # 05-01 产出的 @1x/@2x 背景图合成多分辨率 tiff，让 dmg 背景图支持 retina。
          tiffutil -cathidpicheck assets/dmg-background.png "assets/dmg-background@2x.png" -out "$RUNNER_TEMP/dmg-background.tiff" \
            || { echo "错误: tiffutil 合成背景图失败" >&2; exit 1; }

          # .app 用 ditto 复制到干净的源目录里作为 create-dmg 的源（避免 create-dmg 直接吃
          # .app 时的行为歧义，同时 ditto 保签名）。
          DMG_SRC="$RUNNER_TEMP/dmg-src"
          rm -rf "$DMG_SRC"
          mkdir -p "$DMG_SRC"
          ditto "$APP" "$DMG_SRC/Open-Anti-Browser.app" \
            || { echo "错误: ditto 拷贝 .app 到 dmg 源目录失败" >&2; exit 1; }

          # 不吞退出码：create-dmg 在 CI 会话类型下的 AppleScript 行为未经真实验证过
          # （RESEARCH A4），第一次跑要让真实退出码与完整日志暴露出来。
          create-dmg \
            --volname "Open-Anti-Browser $APP_VERSION" \
            --background "$RUNNER_TEMP/dmg-background.tiff" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 128 \
            --icon "Open-Anti-Browser.app" 150 190 \
            --app-drop-link 450 190 \
            --hide-extension "Open-Anti-Browser.app" \
            --no-internet-enable \
            "$DMG_NAME" \
            "$DMG_SRC"

          if [[ ! -f "$DMG_NAME" ]]; then
            echo "错误: create-dmg 未产出 $DMG_NAME" >&2
            exit 1
          fi
          echo "create-dmg 成功产出: $DMG_NAME"

      - name: Verify dmg contents
        shell: bash
        run: |
          set -euo pipefail
          DMG_NAME="Open-Anti-Browser-${APP_VERSION}-arm64.dmg"
          MOUNT_POINT="$RUNNER_TEMP/dmg-mount"
          rm -rf "$MOUNT_POINT"
          mkdir -p "$MOUNT_POINT"

          hdiutil attach -nobrowse -readonly -mountpoint "$MOUNT_POINT" "$DMG_NAME" \
            || { echo "错误: hdiutil attach 失败: $DMG_NAME" >&2; exit 1; }

          FAIL=0
          [[ -d "$MOUNT_POINT/Open-Anti-Browser.app" ]] \
            || { echo "错误: 挂载点内缺少 Open-Anti-Browser.app" >&2; FAIL=1; }
          [[ -e "$MOUNT_POINT/Applications" ]] \
            || { echo "错误: 挂载点内缺少 Applications 别名" >&2; FAIL=1; }
          [[ -d "$MOUNT_POINT/.background" ]] \
            || { echo "错误: 挂载点内缺少 .background 目录" >&2; FAIL=1; }

          if [[ "$FAIL" -eq 0 ]]; then
            # dmg 打包之后签名依然通过双层验证（D-11/PKG-04）。
            codesign --verify --deep --strict "$MOUNT_POINT/Open-Anti-Browser.app" \
              || { echo "错误: dmg 内外层签名验证失败" >&2; FAIL=1; }
            codesign --verify --deep --strict "$MOUNT_POINT/Open-Anti-Browser.app/Contents/Resources/engines/chrome/Chromium.app" \
              || { echo "错误: dmg 内内核签名验证失败" >&2; FAIL=1; }
          fi

          hdiutil detach "$MOUNT_POINT" || true

          if [[ "$FAIL" -ne 0 ]]; then
            exit 1
          fi
          echo "dmg 内容验证通过"

      - name: Upload macOS dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: Open-Anti-Browser-macos-dmg
          path: Open-Anti-Browser-*-arm64.dmg
          if-no-files-found: error

  release:
    needs: [build, build-macos]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: 'Open-Anti-Browser-*'
          path: release-assets
          merge-multiple: true

      - name: List and verify release assets
        shell: bash
        run: |
          set -euo pipefail
          echo "=== release-assets 目录清单 ==="
          ls -la release-assets

          if [[ ! -f "release-assets/Open-Anti-Browser-Setup.exe" ]]; then
            echo "错误: release-assets 内缺少 Open-Anti-Browser-Setup.exe" >&2
            exit 1
          fi
          if ! compgen -G "release-assets/Open-Anti-Browser-*-arm64.dmg" > /dev/null; then
            echo "错误: release-assets 内缺少 Open-Anti-Browser-*-arm64.dmg" >&2
            exit 1
          fi
          echo "断言通过: Windows 安装包与 macOS arm64 dmg 均已就位"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          body_path: .github/RELEASE_NOTES_TEMPLATE.md
          generate_release_notes: true
          name: "Open-Anti-Browser ${{ github.ref_name }}"
